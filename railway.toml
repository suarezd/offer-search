[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"
# Le contexte de build est la racine du projet
# Le Dockerfile copie les fichiers depuis backend/

[deploy]
# Ne pas définir startCommand ici - utiliser le CMD du Dockerfile à la place
# Railway va utiliser automatiquement le CMD du Dockerfile
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[env]
# Railway injecte automatiquement DATABASE_URL pour PostgreSQL
# Vous pouvez ajouter d'autres variables ici ou via l'interface Railway
