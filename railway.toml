[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"
# Le contexte de build est la racine du projet
# Le Dockerfile copie les fichiers depuis backend/

[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[env]
# Railway injecte automatiquement DATABASE_URL pour PostgreSQL
# Vous pouvez ajouter d'autres variables ici ou via l'interface Railway
