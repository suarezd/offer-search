<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Offer Search</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="../popup.js"></script>
</head>
<body>
  <h2>Offer Search – Offres d'emploi</h2>
  <div class="button-group">
    <button id="scrape-linkedin">Récupérer les offres</button>
    <button id="load-cache" class="btn-secondary">Charger le cache local</button>
    <button id="refresh" class="btn-secondary">Rafraîchir depuis l'API</button>
  </div>

  <div class="filters">
    <input id="search" placeholder="Rechercher (poste, tech, description…)">
    <input id="location" placeholder="Localisation (ville ou Remote)">
    <input id="company" placeholder="Entreprise">
    <select id="source">
      <option value="">Toutes les sources</option>
    </select>
  </div>

  <div id="status">Chargement…</div>
  <div id="results"></div>

  <div class="pagination">
    <button id="prev-page" class="btn-pagination">← Précédent</button>
    <span id="page-info">Page 1/1</span>
    <button id="next-page" class="btn-pagination">Suivant →</button>
  </div>
</body>
</html>
