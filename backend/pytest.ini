[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

addopts =
    -v
    --strict-markers
    --tb=short

markers =
    unit: Unit tests (isolated, no external dependencies) - DEPRECATED: use tests/unit/ directory
    integration: Integration tests (database, external services) - DEPRECATED: use tests/integration/ directory
    functional: Functional/BDD tests (end-to-end scenarios) - DEPRECATED: use tests/functional/ directory
    e2e: End-to-end tests with Selenium (actively used for filtering)
    extension: Extension browser tests (requires local Chrome, not Docker)
    scraping: LinkedIn scraping tests (requires credentials)
    slow: Slow tests (with many waits)
    asyncio: Async tests

filterwarnings =
    ignore::DeprecationWarning
    ignore::RuntimeWarning:pytest_bdd.scenario
