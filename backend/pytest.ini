[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

addopts =
    -v
    --strict-markers
    --tb=short

markers =
    integration: Integration tests (database, external services)
    e2e: End-to-end tests with Selenium
    extension: Extension browser tests (requires local Chrome, not Docker)
    scraping: LinkedIn scraping tests (requires credentials)
    slow: Slow tests (with many waits)
    asyncio: Async tests

filterwarnings =
    ignore::DeprecationWarning
    ignore::RuntimeWarning:pytest_bdd.scenario
